# Cấu hình fleet của dự án (.fleet/project.conf). Mọi khoá đều tuỳ chọn; bỏ dấu # để bật.
# Đọc bởi skill fleet-orchestrator (slot.sh). Không chứa bí mật.

# Nhánh mà việc mới rẽ ra. Mặc định: nhánh mặc định của origin.
base=origin/main

# Số slot (worktree được giữ lại) và cổng dev server: slot k dùng port_base+k.
slots=2
port_base=5200

# Lệnh cài dependency, chạy TRONG từng slot bởi slot.sh (worker không bao giờ cài).
# Chạy lại khi nội dung các lockfiles đổi. Không đặt thì node_modules là junction tới checkout chính (kém an toàn).
deps_cmd=python -m venv .venv && .venv/Scripts/python -m pip install -r requirements.txt -r requirements-test.txt && cd frontend && npm ci
lockfiles=requirements.txt,requirements-test.txt,frontend/package-lock.json

# Thư mục gitignore cần link vào mỗi slot từ checkout chính (danh sách, cách nhau dấu phẩy).
# Chỉ khai báo thư mục worker được phép đọc; link nhầm thư mục dữ liệu thật có thể cho worker ghi vào dữ liệu thật.
link=

# Xoá origin/<nhánh> khi việc đã merge (release và `fleet prune --remote`). Mặc định tắt: bật là quyết định của người dùng.
# Không bao giờ xoá main, master, staging, develop hoặc nhánh mặc định, và không xoá nhánh chưa merge.
#delete_remote_branches=yes
